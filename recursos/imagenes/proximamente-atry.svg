<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Producto ATRY LAB próximamente</title>
  <desc id="desc">Composición minimalista azul oscuro con el isotipo de ATRY y la palabra próximamente.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061b23"/><stop offset="1" stop-color="#164c59"/></linearGradient>
    <radialGradient id="glow" cx="76%" cy="16%" r="72%"><stop stop-color="#22c2df" stop-opacity=".34"/><stop offset="1" stop-color="#22c2df" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#001016" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="1200" rx="88" fill="url(#bg)"/>
  <rect width="1200" height="1200" rx="88" fill="url(#glow)"/>
  <circle cx="930" cy="170" r="260" fill="none" stroke="#8fe9f5" stroke-opacity=".09" stroke-width="2"/>
  <circle cx="930" cy="170" r="185" fill="none" stroke="#8fe9f5" stroke-opacity=".12" stroke-width="2"/>
  <image href="../atry-isotipo.png" x="320" y="190" width="560" height="560" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/>
  <text x="600" y="755" text-anchor="middle" fill="#f8fdff" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="55" letter-spacing="12">ATRY LAB</text>
  <text x="600" y="830" text-anchor="middle" fill="#9edce6" font-family="Arial,Helvetica,sans-serif" font-size="25" letter-spacing="8">PRÓXIMAMENTE</text>
  <text x="600" y="915" text-anchor="middle" fill="#d8edf1" fill-opacity=".72" font-family="Arial,Helvetica,sans-serif" font-size="23">Estamos preparando todos los detalles.</text>
</svg>
